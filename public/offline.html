<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LearM — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        text-align: center;
        background: #fff;
        color: #0c1020;
        font: 18px system-ui;
      }
      main {
        padding: 24px;
        max-width: 420px;
      }
      h1 {
        font-size: 42px;
      }
      span {
        color: #328ed9;
      }
      button {
        background: #52e0b5;
        color: #0c1020;
        border: 0;
        border-radius: 16px;
        padding: 16px 24px;
        font: inherit;
        cursor: pointer;
      }
      html[data-theme='dark'] body {
        background: #0c1020;
        color: #fff;
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem('lingua-theme');
        document.documentElement.dataset.theme =
          t === 'dark' ||
          (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <main>
      <h1>Lear<span>M</span></h1>
      <p>Нет подключения к интернету</p>
      <p>Подключитесь к сети, чтобы продолжить обучение.</p>
      <button onclick="location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
